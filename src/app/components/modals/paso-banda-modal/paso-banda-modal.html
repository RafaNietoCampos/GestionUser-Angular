<div class="modal-backdrop" (click)="onBackdropClick($event)">
  <div class="modal-content">
    <div class="modal-header">
      <h2>Editar {{ editedItem?.type === 'PASO' ? 'Paso' : 'Banda' }}</h2>
      <button class="btn-close" (click)="onClose()">
        <app-x-icon />
      </button>
    </div>

    <div class="modal-body">
      <div class="form-group">
        <label>Título</label>
        <input type="text" [(ngModel)]="editedItem!.title" placeholder="Nombre del paso o banda">
      </div>

      <div class="form-group">
        <label>Tipo</label>
        <select [(ngModel)]="editedItem!.type">
          <option value="PASO">Paso</option>
          <option value="BANDA">Banda</option>
        </select>
      </div>

      <div class="form-group">
        <label>URL de Imagen</label>
        <input type="text" [(ngModel)]="editedItem!.image" placeholder="https://...">
      </div>

      <div class="form-group">
        <label>Descripción</label>
        <textarea [(ngModel)]="editedItem!.description" rows="4" placeholder="Descripción detallada..."></textarea>
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn-secondary" (click)="onClose()">Cancelar</button>
      <button class="btn-primary" (click)="onSave()">Guardar Cambios</button>
    </div>
  </div>
</div>
