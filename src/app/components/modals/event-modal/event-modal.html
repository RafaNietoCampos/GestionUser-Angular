<div class="modal-backdrop" (click)="onBackdropClick($event)">
  <div class="modal-content">
    <div class="modal-header">
      <h2>{{ modalTitle }}</h2>
      <button class="btn-close" (click)="onClose()">
        <app-x-icon />
      </button>
    </div>

    <form (ngSubmit)="onSave()">
      <div class="form-group">
        <label>Título del evento</label>
        <input type="text" name="title" [(ngModel)]="title" placeholder="Título" required>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Fecha</label>
          <div class="input-with-icon">
            <input type="date" name="eventDate" [(ngModel)]="eventDate" required>
          </div>
        </div>
      </div>
      <div class="form-group">
        <label>Grupo</label>
        <select name="groupId" [(ngModel)]="groupId" [disabled]="loading || saving">
          <option [ngValue]="null" disabled selected>Selecciona un grupo (opcional)</option>
          @if (loading) {
          <option [ngValue]="null" disabled>Cargando grupos...</option>
          } @else {
          @for (group of groups; track group.id) {
          <option [ngValue]="group.id">{{ group.name }}</option>
          }
          }
        </select>
        @if (error) {
        <p class="form-error">{{ error }}</p>
        }
      </div>

      <div class="form-group">
        <label>Descripción</label>
        <textarea name="description" rows="4" [(ngModel)]="description"
          placeholder="Definir información del evento."></textarea>
      </div>

      @if (saveError) {
      <p class="form-error">{{ saveError }}</p>
      }

      <div class="modal-footer">
        <button type="button" class="btn-cancel" (click)="onClose()">Cancelar</button>
        <button type="submit" class="btn-save" [disabled]="saving || loading">
          {{ saving ? 'Guardando...' : 'Guardar Evento' }}
        </button>
      </div>
    </form>
  </div>
</div>
